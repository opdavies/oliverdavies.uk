    name: Boris Böhne
    description: Drupal Developer
    url: https://www.drupal.org/u/drubb
    image: /assets/images/recommendations/boris-bohne.jpg
    tags:
      - daily
  - text: >
      <p>I'm liking your short emails. They're just the right length that isn't
      too distracting but I'm able to consume it in a single glance.</p>
    name: Kevin Coyle
    description: Design System Engineering Consultant
    url: https://www.coyledesign.co.uk
    image: /assets/images/recommendations/kevin-coyle.jpg
    tags:
      - daily
  - text: >
      <p>Well done. You've created a really excellent resource here that has the
      potential to bring Drupal development forward a huge leap. You've managed
      to simplify and share some often complex seeming issues.</p>
    name: Adam Nuttall
    description: Drupal Engineer
    image: /assets/images/recommendations/adam-nuttall.jpg
    tags:
      - testing
      - atdc
  - text: >
      <p>The course was very informative. One of the biggest pain points with
      Drupal testing was that there was no clear and definitive guide on setting
      up the php unit XML file to get functional and kernel tests working right
      away. Your guide was fantastic and I will definitely be using it going
      forward in my module development for work.</p>
    name: Frank Landry
    description: null
    image: /assets/images/recommendations/frank-landry.jpg
    tags:
      - testing
      - atdc
  - text: >
      <p>This course is really great and I've recommended it to my coworkers
      here at Palantir.net.</p>
    name: Daniel Davis-Boxleitner
    description: Senior Engineer at Palantir.net
    image: /assets/images/recommendations/daniel-davis-boxleitner.jpg
    tags:
      - testing
      - atdc
  - text: >
      <p>Oliver devised a creative and original approach to Drupal theme
      switching based on Tailwind and provided us with the building blocks and
      basic theming.</p>

      <p>He gave several helpful mentoring sessions with our front end developer to support us to build this approach into our site.</p>
    name: Technical Director, European knowledge platform
    tags:
      - front
